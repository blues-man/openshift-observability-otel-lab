---
site:
  title: "OpenShift Observability with OpenTelemetry"
  url: https://github.com/blues-man/openshift-observability-otel-lab
  start_page: modules::index.adoc

content:
  sources:
    - url: .
      start_path: content

ui:
  bundle:
    url: https://github.com/rhpds/rhdp_showroom_theme/releases/download/latest/ui-bundle.zip
    snapshot: true
  supplemental_files: ./content/supplemental-ui

antora:
  extensions:
    # Renders [mermaid] diagram blocks. The npm dep is in package.json;
    # Antora only loads it when it is registered here.
    - require: '@sntke/antora-mermaid-extension'
      mermaid_library_url: "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs"
      script_stem: footer-scripts
      mermaid_initialize_options:
        start_on_load: true
        # Render diagrams at natural size instead of shrinking to the
        # container. In the split-screen showroom the content pane is narrow
        # (e.g. w=50), so useMaxWidth:true made diagrams tiny. With this off,
        # text stays full-size and the pane scrolls horizontally if needed.
        flowchart:
          use_max_width: false
        sequence:
          use_max_width: false

runtime:
  cache_dir: ./.cache/antora

output:
  dir: ./www
