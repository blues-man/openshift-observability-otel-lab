---
site:
  title: "OpenShift Observability with OpenTelemetry"
  url: https://github.com/blues-man/openshift-observability-otel-lab
  start_page: modules::index.adoc

content:
  sources:
    - url: .
      start_path: content

ui:
  bundle:
    url: https://github.com/rhpds/rhdp_showroom_theme/releases/download/latest/ui-bundle.zip
    snapshot: true
  supplemental_files: ./content/supplemental-ui

antora:
  extensions:
    # Renders [mermaid] diagram blocks. The npm dep is in package.json;
    # Antora only loads it when it is registered here.
    - require: '@sntke/antora-mermaid-extension'
      mermaid_library_url: "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs"
      # Register the mermaid loader under a UNIQUE partial stem (its file is
      # always partials/mermaid-script.hbs). With the default/previous
      # script_stem: footer-scripts the extension registered a SECOND partial
      # with stem "footer-scripts" at uiLoaded -- after the theme and our
      # supplemental partials -- so {{> footer-scripts}} resolved to the
      # mermaid-only file and dropped the theme's clipboard.js/site.js, killing
      # the copy/execute buttons. A unique stem stops the collision; our
      # supplemental partials/footer-scripts.hbs pulls mermaid back in with
      # {{> mermaid-script}}.
      script_stem: mermaid-script
      mermaid_initialize_options:
        start_on_load: true
        # Keep useMaxWidth:true (the default) so diagrams stay responsive and
        # rescale as the split-screen sidebar is dragged. Each SVG fills the
        # content pane up to its natural width and scales down in narrower
        # panes. To see a wide diagram larger, widen the pane.
        flowchart:
          use_max_width: true
        sequence:
          use_max_width: true

runtime:
  cache_dir: ./.cache/antora

output:
  dir: ./www
