backend:
  enabled: true
  tempo:
    namespace: tempo-observability
    storageSize: 1Gi
    # TempoStack compactor retention. Keep SHORT: traces are the heaviest signal
    # (~9GiB/24h across 20 users); 48h filled the disk before blocks aged out
    # and deadlocked compaction. 24h + 20Gi holds steady-state with headroom.
    retention: 24h
    minio:
      accessKey: tempo
      secretKey: supersecret
      storageSize: 20Gi
  loki:
    namespace: openshift-logging
    storageSize: 1Gi
    # LokiStack compactor retention (days). Without it MinIO fills and the
    # ingester stalls (S3 507) -> "empty ring" in Observe -> Logs.
    retentionDays: 3
    minio:
      accessKey: loki
      secretKey: supersecret
      # Sized for 20-30 users w/ 3d retention (carries app + heavy infra logs).
      storageSize: 15Gi
  coo:
    namespace: coo-observability
    retentionDays: 7
  uwm:
    enabled: true
deployer:
  domain: ""
