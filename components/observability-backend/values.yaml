backend:
  enabled: true
  tempo:
    namespace: tempo-observability
    storageSize: 1Gi
    # TempoStack compactor retention. Without it tempo-minio fills (S3 507) and
    # the trace UI goes empty. Sized for 20-30 users; 5Gi filled in ~2.5 days.
    retention: 48h
    minio:
      accessKey: tempo
      secretKey: supersecret
      storageSize: 10Gi
  loki:
    namespace: openshift-logging
    storageSize: 1Gi
    # LokiStack compactor retention (days). Without it MinIO fills and the
    # ingester stalls (S3 507) -> "empty ring" in Observe -> Logs.
    retentionDays: 3
    minio:
      accessKey: loki
      secretKey: supersecret
      # Sized for 20-30 concurrent users; 5Gi filled in ~2.5 days.
      storageSize: 10Gi
  coo:
    namespace: coo-observability
    retentionDays: 7
  uwm:
    enabled: true
deployer:
  domain: ""
