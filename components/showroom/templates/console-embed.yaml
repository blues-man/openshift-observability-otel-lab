{{- $ns := .Values.showroom.namespace | default "showroom" }}
{{- if and .Values.showroom.enabled (.Values.showroom.consoleEmbed).enabled .Values.deployer.domain }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.showroom.name }}-console-embed
  namespace: {{ $ns }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $ns }}-console-embed
rules:
- apiGroups:
  - operator.openshift.io
  resources:
  - ingresscontrollers
  verbs:
  - get
  - patch
# The Job also reads the router deployment (to watch the rollout) and the
# console route (to resolve the host it polls for framing headers). Without
# these, `oc get route console` fails, CONSOLE_HOST is empty, and the verify
# loop polls https:/// for the full 60 attempts (~10 min) before exiting 0 —
# so the framing check never actually runs.
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
- apiGroups:
  - route.openshift.io
  resources:
  - routes
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $ns }}-console-embed
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $ns }}-console-embed
subjects:
- kind: ServiceAccount
  name: {{ .Values.showroom.name }}-console-embed
  namespace: {{ $ns }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.showroom.name }}-console-embed
  namespace: {{ .Values.showroom.namespace | default "showroom" }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 4
  template:
    spec:
      serviceAccountName: {{ .Values.showroom.name }}-console-embed
      restartPolicy: OnFailure
      containers:
      - name: patch
        image: registry.redhat.io/openshift4/ose-cli:latest
        command:
        - /bin/bash
        - -c
        - |
          echo "Patching IngressController to allow console iframe embedding..."
          oc patch ingresscontroller default \
            -n openshift-ingress-operator \
            --type=merge \
            -p '{
              "spec": {
                "httpHeaders": {
                  "actions": {
                    "response": [
                      {
                        "name": "X-Frame-Options",
                        "action": {
                          "type": "Delete"
                        }
                      },
                      {
                        "name": "Content-Security-Policy-Report-Only",
                        "action": {
                          "type": "Delete"
                        }
                      },
                      {
                        "name": "Content-Security-Policy",
                        "action": {
                          "type": "Set",
                          "set": {
                            "value": "frame-ancestors '"'"'self'"'"' https://*.{{ .Values.deployer.domain }}"
                          }
                        }
                      }
                    ]
                  }
                }
              }
            }'
          echo "IngressController patched. Waiting for router rollout to begin..."
          # The ingress operator needs a moment to observe the spec change and
          # roll a new router revision. `oc rollout status` on its own races: it
          # can report the PREVIOUS generation as complete before the new rollout
          # even starts, so the Job finishes while the console still serves
          # X-Frame-Options: DENY for several minutes. Instead, poll the actual
          # console response until the router has stripped the framing headers.
          oc rollout status deployment/router-default -n openshift-ingress --timeout=300s || true
          CONSOLE_HOST=$(oc get route console -n openshift-console -o jsonpath='{.spec.host}')
          echo "Verifying framing headers on https://${CONSOLE_HOST}/ ..."
          for i in $(seq 1 60); do
            HDRS=$(curl -sS -I -k --max-time 10 "https://${CONSOLE_HOST}/" 2>/dev/null || true)
            if [ -z "$HDRS" ]; then
              echo "  attempt ${i}: no response yet, waiting 10s..."
              sleep 10
              continue
            fi
            if echo "$HDRS" | grep -qi '^x-frame-options'; then
              echo "  attempt ${i}: X-Frame-Options still present, waiting 10s..."
              sleep 10
            else
              echo "  attempt ${i}: framing headers stripped. Console is now embeddable."
              break
            fi
          done
          echo "Console embed patch complete."
{{- end }}
