{{- if .Values.showroom.enabled }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.showroom.namespace | default "showroom" }}
  labels:
    demo.redhat.com/application: "showroom"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.showroom.name }}
  namespace: {{ .Values.showroom.namespace }}
{{- if .Values.showroom.userdata.userName }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.showroom.userdata.userName }}-admin
  namespace: {{ .Values.showroom.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: User
  name: {{ .Values.showroom.userdata.userName }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: edit-{{ .Values.showroom.name }}-sa
  namespace: {{ .Values.showroom.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
- kind: ServiceAccount
  name: {{ .Values.showroom.name }}
  namespace: {{ .Values.showroom.namespace }}
---
kind: ConfigMap
metadata:
  name: {{ .Values.showroom.name }}-proxy-config
  namespace: {{ .Values.showroom.namespace }}
apiVersion: v1
data:
  nginx.conf: |
    events {
    }
    error_log /dev/stdout info;
    http {
      include /etc/nginx/mime.types;
      proxy_cache off;
      expires -1;
      proxy_cache_path /dev/null keys_zone=mycache:10m;
      map $http_upgrade $connection_upgrade {
          default upgrade;
          '' close;
      }
      server {
        listen 8080;
        absolute_redirect off;
        location / {
          proxy_pass http://127.0.0.1:8000;
          expires off;
          proxy_cache off;
          proxy_pass_request_headers on;
          proxy_set_header Accept-Encoding "gzip";
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }
        {{- if .Values.showroom.terminal.enabled }}
        location /terminal/ {
          proxy_pass http://127.0.0.1:7681;
          rewrite ^/terminal/(.*)$ /$1 break;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade";
          proxy_read_timeout 43200000;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header Host $http_host;
          proxy_set_header X-NginX-Proxy true;
        }
        {{- end }}
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.showroom.name }}-userdata
  namespace: {{ .Values.showroom.namespace }}
data:
  user_data.yml: |
    cluster_domain: {{ .Values.deployer.domain }}
    demo_namespace: {{ .Values.demo.namespace }}
    demo_app: {{ .Values.demo.appName }}
    ocp_version: "4.22"
    openshift_console_url: "https://console-openshift-console.{{ .Values.deployer.domain }}"
    openshift_api_url: "https://api.{{ .Values.deployer.domain | trimPrefix "apps." }}:6443"
    tempo_namespace: {{ .Values.showroom.userdata.tempoNamespace | default "tempo-observability" | quote }}
    loki_namespace: {{ .Values.showroom.userdata.lokiNamespace | default "openshift-logging" | quote }}
    coo_namespace: {{ .Values.showroom.userdata.cooNamespace | default "coo-observability" | quote }}
    tutorial_namespace: {{ .Values.showroom.userdata.tutorialNamespace | default "tutorial-application" | quote }}
    user_name: {{ .Values.showroom.userdata.userName | default "user1" | quote }}
    user_password: {{ .Values.showroom.userdata.userPassword | default "openshift" | quote }}
{{- if (.Values.showroom.userdata.keycloak).passwordLookup }}
---
# Resolver script: reads the RHDP Keycloak realm export and rewrites the
# user_password line of user_data.yml with the real per-user password.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.showroom.name }}-userdata-resolver
  namespace: {{ .Values.showroom.namespace }}
data:
  resolve.py: |
    import json, os, sys

    user = os.environ.get("USER_NAME", "")
    path = "/user_data/user_data.yml"

    raw = sys.stdin.read().strip()
    pw = None
    if raw:
        try:
            realm = json.loads(raw)
            for u in realm.get("users", []):
                if u.get("username") == user:
                    for c in u.get("credentials", []):
                        if c.get("type") == "password" and c.get("value"):
                            pw = c["value"]
                            break
                    break
        except Exception as e:
            sys.stderr.write("resolve: failed to parse realm: %s\n" % e)

    if not pw:
        sys.stderr.write("resolve: no Keycloak password for '%s'; keeping fallback\n" % user)
        sys.exit(0)

    with open(path) as f:
        lines = f.read().splitlines()
    out, replaced = [], False
    for ln in lines:
        if ln.startswith("user_password:"):
            out.append('user_password: "%s"' % pw)
            replaced = True
        else:
            out.append(ln)
    if not replaced:
        out.append('user_password: "%s"' % pw)
    with open(path, "w") as f:
        f.write("\n".join(out) + "\n")
    sys.stderr.write("resolve: user_password set from Keycloak for '%s'\n" % user)
{{- if .Values.showroom.userdata.userName }}
---
# Allow the showroom ServiceAccount to read ONLY the Keycloak realm secret,
# in the Keycloak namespace, so the init container can resolve the password.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.showroom.userdata.userName }}-showroom-kc-read
  namespace: {{ .Values.showroom.userdata.keycloak.namespace | default "keycloak" }}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames:
  - {{ .Values.showroom.userdata.keycloak.realmSecret | default "keycloak-sso-realm" }}
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.showroom.userdata.userName }}-showroom-kc-read
  namespace: {{ .Values.showroom.userdata.keycloak.namespace | default "keycloak" }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.showroom.userdata.userName }}-showroom-kc-read
subjects:
- kind: ServiceAccount
  name: {{ .Values.showroom.name }}
  namespace: {{ .Values.showroom.namespace }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.showroom.name }}-terminal-lab-user-home
  namespace: {{ .Values.showroom.namespace }}
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: "5Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.showroom.name }}
  namespace: {{ .Values.showroom.namespace }}
spec:
  type: ClusterIP
  ports:
  - port: 8080
    protocol: TCP
    targetPort: 8080
  selector:
    app.kubernetes.io/name: {{ .Values.showroom.name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.showroom.name }}
  namespace: {{ .Values.showroom.namespace }}
  labels:
    demo.redhat.com/application: "showroom"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.showroom.name }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.showroom.name }}
    spec:
      serviceAccountName: {{ .Values.showroom.name }}
      initContainers:
      {{- if (.Values.showroom.userdata.keycloak).passwordLookup }}
      - name: resolve-userdata
        image: registry.redhat.io/openshift4/ose-cli:latest
        env:
        - name: USER_NAME
          value: {{ .Values.showroom.userdata.userName | default "user1" | quote }}
        command:
        - /bin/bash
        - -c
        - |
          set -o pipefail
          cp /user_data_base/user_data.yml /user_data/user_data.yml
          echo "resolve: base user_data copied; resolving password from Keycloak..."
          oc extract secret/{{ .Values.showroom.userdata.keycloak.realmSecret | default "keycloak-sso-realm" }} \
            -n {{ .Values.showroom.userdata.keycloak.namespace | default "keycloak" }} \
            --keys={{ .Values.showroom.userdata.keycloak.realmSecretKey | default "sso-realm.json" }} \
            --to=- 2>/dev/null | python3 /scripts/resolve.py \
            || echo "resolve: Keycloak lookup unavailable, keeping fallback password"
        volumeMounts:
        - name: user-data-base
          mountPath: /user_data_base
        - name: user-data
          mountPath: /user_data
        - name: userdata-resolver
          mountPath: /scripts
      {{- end }}
      - name: git-cloner
        image: "quay.io/rhpds/git-cloner:v1.1.2"
        env:
        - name: GIT_REPO_URL
          value: {{ .Values.showroom.content.repoUrl | quote }}
        - name: GIT_REPO_REF
          value: {{ .Values.showroom.content.repoRef | quote }}
        - name: CLONE_DIR
          value: "/showroom/repo"
        volumeMounts:
        - mountPath: /showroom/repo
          name: showroom-files
          subPath: repo
      - name: antora-builder
        image: "quay.io/rhpds/antora:v1.0.1"
        env:
        - name: FILES_DIR
          value: "/showroom/repo"
        - name: OUTPUT_DIR
          value: "/showroom/www"
        - name: ANTORA_SITE_FILE
          value: {{ .Values.showroom.content.antoraPlaybook | quote }}
        volumeMounts:
        - mountPath: /showroom/repo
          name: showroom-files
          subPath: repo
        - name: user-data
          mountPath: /user_data/
        - mountPath: /showroom/www
          name: showroom-files
          subPath: www
      containers:
      - name: nginx
        image: "quay.io/rhpds/nginx:1.25"
        imagePullPolicy: "IfNotPresent"
        volumeMounts:
        - mountPath: /etc/nginx/nginx.conf
          name: nginx-config
          subPath: nginx.conf
        - mountPath: /var/cache/nginx
          name: nginx-cache
        - mountPath: /var/run
          name: nginx-pid
        ports:
        - name: web
          containerPort: 8080
      - name: content
        image: {{ .Values.showroom.content.image | quote }}
        imagePullPolicy: "IfNotPresent"
        env:
        - name: GIT_REPO_URL
          value: {{ .Values.showroom.content.repoUrl | quote }}
        - name: GIT_REPO_REF
          value: {{ .Values.showroom.content.repoRef | quote }}
        - name: ANTORA_PLAYBOOK
          value: {{ .Values.showroom.content.antoraPlaybook | quote }}
        - name: DOMAIN
          value: {{ .Values.deployer.domain | quote }}
        {{- if .Values.showroom.nookbag.enabled }}
        - name: ZT_BUNDLE
          value: {{ .Values.showroom.nookbag.bundleUrl | quote }}
        - name: ZT_UI_ENABLED
          value: "true"
        - name: GUID
          value: {{ .Values.showroom.namespace | quote }}
        {{- end }}
        volumeMounts:
        - name: user-data
          mountPath: /user_data/
        - mountPath: /showroom/repo
          name: showroom-files
          subPath: repo
        - mountPath: /showroom/www
          name: showroom-files
          subPath: www
        ports:
        - containerPort: 8000
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /
            port: 8000
        readinessProbe:
          httpGet:
            path: /
            port: 8000
      {{- if .Values.showroom.terminal.enabled }}
      - name: terminal
        image: {{ .Values.showroom.terminal.image | quote }}
        imagePullPolicy: IfNotPresent
        env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        volumeMounts:
        - name: terminal-lab-user-home
          mountPath: /home/lab-user
        ports:
        - containerPort: 7681
          protocol: TCP
        resources:
          limits:
            cpu: {{ .Values.showroom.terminal.resources.limits.cpu }}
            memory: {{ .Values.showroom.terminal.resources.limits.memory }}
          requests:
            cpu: {{ .Values.showroom.terminal.resources.requests.cpu }}
            memory: {{ .Values.showroom.terminal.resources.requests.memory }}
      {{- end }}
      volumes:
      - name: showroom-files
        emptyDir: {}
      {{- if (.Values.showroom.userdata.keycloak).passwordLookup }}
      # Writable copy populated by the resolve-userdata init container.
      - name: user-data
        emptyDir: {}
      - name: user-data-base
        configMap:
          name: {{ .Values.showroom.name }}-userdata
      - name: userdata-resolver
        configMap:
          name: {{ .Values.showroom.name }}-userdata-resolver
      {{- else }}
      - name: user-data
        configMap:
          name: {{ .Values.showroom.name }}-userdata
      {{- end }}
      - name: nginx-config
        configMap:
          defaultMode: 420
          name: {{ .Values.showroom.name }}-proxy-config
      - name: nginx-pid
        emptyDir: {}
      - name: nginx-cache
        emptyDir: {}
      - name: terminal-lab-user-home
        persistentVolumeClaim:
          claimName: {{ .Values.showroom.name }}-terminal-lab-user-home
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ .Values.showroom.name }}
  namespace: {{ .Values.showroom.namespace }}
  annotations:
    haproxy.router.openshift.io/timeout: 1h
    haproxy.router.openshift.io/timeout-tunnel: 1h
spec:
  to:
    kind: Service
    name: {{ .Values.showroom.name }}
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
{{- end }}
