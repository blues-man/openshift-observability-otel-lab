{{- if .Values.app.enabled }}
{{- if .Values.app.user }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.app.user }}-admin
  namespace: {{ .Values.app.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: User
  name: {{ .Values.app.user }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: {{ .Values.app.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-collector-k8sattributes-{{ .Values.app.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-collector-k8sattributes-{{ .Values.app.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-collector-k8sattributes-{{ .Values.app.namespace }}
subjects:
  - kind: ServiceAccount
    name: otel-collector
    namespace: {{ .Values.app.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-collector-tempo-write-{{ .Values.app.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
  - apiGroups:
      - tempo.grafana.com
    resources:
      - dev
    resourceNames:
      - traces
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-collector-tempo-write-{{ .Values.app.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-collector-tempo-write-{{ .Values.app.namespace }}
subjects:
  - kind: ServiceAccount
    name: otel-collector
    namespace: {{ .Values.app.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-collector-loki-write-{{ .Values.app.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
  - apiGroups:
      - loki.grafana.com
    resources:
      - application
    resourceNames:
      - logs
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-collector-loki-write-{{ .Values.app.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-collector-loki-write-{{ .Values.app.namespace }}
subjects:
  - kind: ServiceAccount
    name: otel-collector
    namespace: {{ .Values.app.namespace }}
---
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel
  namespace: {{ .Values.app.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  mode: deployment
  serviceAccount: otel-collector
  image: {{ .Values.app.collector.image }}
  ports:
    - name: count-metrics
      port: 8889
      protocol: TCP
  # Have the operator create a ServiceMonitor for the collector's :8888
  # internal-telemetry endpoint so User Workload Monitoring scrapes the
  # otelcol_* metrics (e.g. otelcol_processor_tail_sampling_*). Without this
  # the console Observe -> Metrics queries in the sampling modules return no
  # data. UWM must be enabled cluster-wide (enableUserWorkload: true).
  observability:
    metrics:
      enableMetrics: true
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    connectors:
      count:
        spans:
          telemetry.spans.count:
            description: "Total number of spans"
            conditions:
              - 'attributes["http.route"] != "/health"'
            attributes:
              - key: service.name
                default_value: unknown
              - key: k8s.namespace.name
                default_value: unknown
          telemetry.spans.high_cardinality.count:
            description: "Spans with more than 10 attributes"
            conditions:
              - 'Len(attributes) > 10'
            attributes:
              - key: service.name
                default_value: unknown
          telemetry.spans.health.count:
            description: "Health check spans"
            conditions:
              - 'attributes["http.route"] == "/health"'
            attributes:
              - key: service.name
                default_value: unknown
        logs:
          telemetry.logs.count:
            description: "Total number of logs"
            attributes:
              - key: service.name
                default_value: unknown
              - key: k8s.namespace.name
                default_value: unknown
          telemetry.logs.debug.count:
            description: "Debug-level logs"
            conditions:
              - 'severity_number < 9'
            attributes:
              - key: service.name
                default_value: unknown
          telemetry.logs.large.count:
            description: "Log bodies larger than 1000 bytes"
            conditions:
              - 'Len(body) > 1000'
            attributes:
              - key: service.name
                default_value: unknown
    processors:
      batch:
        send_batch_size: 10000
        timeout: 10s
      memory_limiter:
        check_interval: 1s
        limit_mib: 4000
        spike_limit_mib: 800
      filter/drop-debug-logs:
        error_mode: ignore
        logs:
          log_record:
            - 'severity_number < 9'
      filter/drop-large-logs:
        error_mode: ignore
        logs:
          log_record:
            - 'Len(body) > 1000'
      filter/drop-health-spans:
        error_mode: ignore
        traces:
          span:
            - 'attributes["http.route"] == "/health"'
    exporters:
      otlphttp/tempo:
        endpoint: "https://tempo-simplest-gateway.{{ .Values.app.observabilityViewer.tempoNamespace | default "tempo-observability" }}.svc:8080/api/traces/v1/dev"
        tls:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
        headers:
          Authorization: "Bearer ${file:/var/run/secrets/kubernetes.io/serviceaccount/token}"
      otlphttp/loki:
        endpoint: "https://{{ .Values.app.observabilityViewer.lokiName | default "logging-loki" }}-gateway-http.{{ .Values.app.observabilityViewer.lokiNamespace | default "openshift-logging" }}.svc:8080/api/logs/v1/application/otlp"
        tls:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
        headers:
          Authorization: "Bearer ${file:/var/run/secrets/kubernetes.io/serviceaccount/token}"
      prometheus:
        endpoint: 0.0.0.0:8889
      debug:
        verbosity: basic
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, filter/drop-health-spans, batch]
          exporters: [otlphttp/tempo, debug]
        traces/profile:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [count]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, filter/drop-debug-logs, filter/drop-large-logs, batch]
          exporters: [otlphttp/loki, debug]
        logs/profile:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [count]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug]
        metrics/count:
          receivers: [count]
          exporters: [prometheus]
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: otel-count-metrics
  namespace: {{ .Values.app.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  endpoints:
    - port: count-metrics
      interval: 15s
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
{{- end }}
