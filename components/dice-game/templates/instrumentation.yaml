{{- if .Values.app.enabled }}
---
apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: my-instrumentation
  namespace: {{ .Values.app.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  exporter:
    endpoint: "http://otel-collector.{{ .Values.app.namespace }}.svc.cluster.local:4317"
  propagators:
    - tracecontext
    - baggage
    - b3
  sampler:
    type: parentbased_traceidratio
    argument: "1"
  python:
    env:
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: "http://otel-collector.{{ .Values.app.namespace }}.svc.cluster.local:4318"
      - name: OTEL_LOGS_EXPORTER
        value: otlp
      - name: OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED
        value: "true"
  nodejs:
    env:
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: "http://otel-collector.{{ .Values.app.namespace }}.svc.cluster.local:4318"
  java:
    env:
      # The Red Hat Java auto-instrumentation agent exports via HTTP/protobuf
      # (OkHttp) by default. Without this override it inherits the top-level
      # spec.exporter.endpoint (:4317, the gRPC port) and every export fails
      # with "Connection reset" -- so backend2 produced NO traces. Point it at
      # the collector's :4318 HTTP receiver, exactly like the nodejs/python
      # blocks above.
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: "http://otel-collector.{{ .Values.app.namespace }}.svc.cluster.local:4318"
      - name: OTEL_LOGS_EXPORTER
        value: otlp
{{- end }}
